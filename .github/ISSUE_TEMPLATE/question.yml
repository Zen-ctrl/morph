name: Question
description: Ask about setup, contracts, SDK, CLI, evaluation, or the workbench.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and context
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation already reviewed
      description: List the README or docs sections you checked.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal synthetic example
      description: Optional, but useful for API, CLI, and format questions.
  - type: checkboxes
    id: checks
    attributes:
      label: Data safety
      options:
        - label: This issue contains no credentials, private datasets, provider responses, or sensitive artifact contents.
          required: true
